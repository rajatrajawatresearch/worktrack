# WorkTrack — production stack (single small VPS).
#   Internet -> Nginx (80/443) -> FastAPI (internal) -> PostgreSQL (internal)
#
# Build the admin app first:  cd admin && npm ci && npm run build
# Then:  docker compose -f docker-compose.prod.yml up -d --build
#
# Required env (set in .env or the shell): JWT_SECRET, POSTGRES_PASSWORD, CORS_ORIGINS

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worktrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-worktrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # NOT exposed to the host/internet — only reachable on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worktrack}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-worktrack}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-worktrack}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      ENVIRONMENT: production
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      SEED_SUPERADMIN: ${SEED_SUPERADMIN:-1}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@worktrack.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000" # internal only; Nginx proxies to it
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/proxy_params_worktrack.conf:/etc/nginx/proxy_params_worktrack.conf:ro
      - ./admin/dist:/usr/share/nginx/html:ro
      # For HTTPS, mount your certs and enable the 443 block in default.conf:
      # - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      # - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
