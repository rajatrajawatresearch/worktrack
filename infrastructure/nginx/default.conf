# WorkTrack reverse proxy + admin SPA host.

# Rate-limit login attempts at the edge (in addition to app-level limiting).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

upstream worktrack_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Enable HSTS only when serving over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ---- API + docs -> FastAPI backend ----
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://worktrack_backend;
        include /etc/nginx/proxy_params_worktrack.conf;
    }

    location /api/ {
        proxy_pass http://worktrack_backend;
        include /etc/nginx/proxy_params_worktrack.conf;
    }

    location ~ ^/(docs|redoc|openapi.json|health)$ {
        proxy_pass http://worktrack_backend;
        include /etc/nginx/proxy_params_worktrack.conf;
    }

    # ---- Admin SPA (static) ----
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

