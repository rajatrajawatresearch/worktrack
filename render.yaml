# WorkTrack — Render.com free-tier blueprint (Backend + PostgreSQL + Admin static).
# In Render: New + -> Blueprint -> pick the neurosynthlabs/annaapp repo.
# NOTE: free web services sleep after inactivity (cold start); free Postgres has
# storage/retention limits. Good for demos/small teams. See docs/deployment.md.
#
# This uses a MANAGED database (Render Postgres). The original spec preferred a
# self-hosted Postgres (docker-compose.prod.yml) — use that path if you must
# fully own the DB.

databases:
  - name: worktrack-db
    plan: free
    databaseName: worktrack
    user: worktrack

services:
  - type: web
    name: worktrack-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worktrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false # set to your admin site URL, e.g. https://worktrack-admin.onrender.com
      - key: SEED_SUPERADMIN
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false

  - type: web
    name: worktrack-admin
    runtime: static
    buildCommand: cd admin && npm install && npm run build
    staticPublishPath: ./admin/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to your API URL + /api/v1, e.g. https://worktrack-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
